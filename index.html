<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-to-Meme Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>✨ Mood-to-Meme ✨</h1>
        <p class="subtitle">Select your mood & get an instant vibe check 💖</p>

        <div class="buttons">
            <button onclick="showMeme('happy')">😊 Happy</button>
            <button onclick="showMeme('sad')">😢 Sad</button>
            <button onclick="showMeme('bored')">😐 Bored</button>
            <button onclick="showMeme('excited')">🤩 Excited</button>
        </div>

        <div id="meme-container">
            <img id="meme" src="" alt="Your meme will appear here">
        </div>

        <button id="next-btn" onclick="nextMeme()" style="display:none;">Show Another 💫</button>
    </div>

    <footer>
        <p>Made with 💖 by <span>YOU</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
